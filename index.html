    <script>
      // Cursor-following spotlight. rAF-throttled CSS-var writes so we
      // don't fight the compositor; short-circuits on reduced-motion and
      // on touch-primary devices (where there's no cursor to follow).
      (function () {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        if (window.matchMedia('(hover: none)').matches) return;
        var body = document.body;
        var pendingX = 0, pendingY = 0, scheduled = false;
        window.addEventListener('mousemove', function (e) {
          pendingX = e.clientX;
          pendingY = e.clientY;
          if (!scheduled) {
            scheduled = true;
            requestAnimationFrame(function () {
              body.style.setProperty('--mouse-x', pendingX + 'px');
              body.style.setProperty('--mouse-y', pendingY + 'px');
              if (!body.classList.contains('has-cursor')) body.classList.add('has-cursor');
              scheduled = false;
            });
          }
        }, { passive: true });
        window.addEventListener('mouseleave', function () {
          body.classList.remove('has-cursor');
        });
      })();
    </script>
    <script>
      // Probe each subdomain from the visitor's own browser. mode:no-cors
      // makes the request cross-origin-safe at the cost of getting an
      // opaque response — but we only need the binary signal: the
      // promise resolves on any HTTP response (host is reachable from
      // this network), rejects on DNS failure / connection refused / TLS
      // error / timeout (not reachable). 5s timeout via AbortController.
      // no-referrer + credentials:omit so we don't leak anything to
      // the target hosts.
      (function () {
        function check(host) {
          var ctrl = new AbortController();
          var timer = setTimeout(function () { ctrl.abort(); }, 5000);
          return fetch('https://' + host + '/?t=' + Date.now(), {
            mode: 'no-cors',
            cache: 'no-store',
            credentials: 'omit',
            referrerPolicy: 'no-referrer',
            signal: ctrl.signal
          })
            .then(function () { return true; })
            .catch(function () { return false; })
            .then(function (up) { clearTimeout(timer); return up; });
        }

        document.querySelectorAll('[data-host]').forEach(function (el) {
          check(el.dataset.host).then(function (up) {
            el.classList.add(up ? 'is-up' : 'is-down');
            el.title = up ? 'Online' : 'Offline';
            if (up) {
              var menu = el.closest('.menu');
              if (menu) menu.hidden = false;
            }
          });
        });
      })();
    </script>
