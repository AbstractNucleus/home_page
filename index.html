<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noel Kleen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css?v=__CSS_VERSION__" />
  </head>
  <body
    class="bg-bg text-text font-mono min-h-screen flex items-center justify-center px-8 py-16 md:py-0"
  >
    <main
      class="w-full max-w-5xl flex flex-col md:flex-row md:items-start gap-12 md:gap-16"
    >
      <!-- Left: identity -->
      <section class="md:w-1/3 flex flex-col gap-6 animate-in">
        <div>
          <p class="t-eyebrow mb-3">colophon</p>
          <h1
            class="text-4xl md:text-5xl font-semibold tracking-tight leading-none mb-2"
            style="letter-spacing: -0.04em"
          >
            noel <span style="white-space: nowrap"
              >kleen<span class="caret" aria-hidden="true"></span></span>
          </h1>
          <p class="text-sub text-sm" style="color: var(--color-sub)">
            noelkleen.com
          </p>
        </div>

        <nav class="flex items-center gap-5" aria-label="contact">
          <a
            href="https://github.com/AbstractNucleus"
            target="_blank"
            rel="noopener noreferrer"
            class="social-link"
            aria-label="github"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"
              />
            </svg>
          </a>

          <a
            href="https://discord.com/users/abstractnucleus"
            target="_blank"
            rel="noopener noreferrer"
            class="social-link"
            aria-label="discord"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"
              />
            </svg>
          </a>

          <a
            href="mailto:noelhkleen@gmail.com"
            class="social-link"
            aria-label="email"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="M22 7l-10 6L2 7" />
            </svg>
          </a>
        </nav>
      </section>

      <!-- Right: subdomains -->
      <section class="md:w-2/3 flex flex-col md:flex-row md:items-start gap-8 md:gap-6">
        <div class="flex flex-col gap-3 md:flex-1">
          <p class="t-eyebrow mb-1 animate-in">elsewhere</p>

          <a
            href="https://party.noelkleen.com"
            class="card-link block rounded-lg px-6 py-5 animate-in"
            style="animation-delay: 80ms"
          >
            <div class="text-sm font-medium mb-0.5">party games</div>
            <div class="text-xs" style="color: var(--color-sub)">
              party.noelkleen.com
            </div>
          </a>

          <a
            href="https://dynmap.noelkleen.com"
            class="card-link block rounded-lg px-6 py-5 animate-in"
            style="animation-delay: 160ms"
          >
            <div class="text-sm font-medium mb-0.5">
              dynmap <span style="color: var(--color-sub); white-space: nowrap">· kobra-kollektivet</span>
            </div>
            <div class="text-xs" style="color: var(--color-sub)">
              dynmap.noelkleen.com
            </div>
          </a>
        </div>

        <div class="flex flex-col gap-3 md:flex-1">
          <p
            class="t-eyebrow mb-1 animate-in"
            style="animation-delay: 240ms"
          >
            collaborations
          </p>

          <a
            href="https://notes.noelkleen.com"
            class="card-link block rounded-lg px-6 py-5 animate-in"
            style="animation-delay: 320ms"
          >
            <div class="text-sm font-medium mb-0.5">notes</div>
            <div class="text-xs" style="color: var(--color-sub)">
              notes.noelkleen.com
            </div>
          </a>
        </div>

        <div class="flex flex-col gap-3 md:flex-1">
          <p
            class="t-eyebrow mb-1 animate-in"
            style="animation-delay: 400ms"
          >
            private
          </p>

          <a
            href="https://analytics.noelkleen.com"
            class="card-link block rounded-lg px-6 py-5 animate-in"
            style="animation-delay: 480ms"
          >
            <div class="text-sm font-medium mb-0.5">analytics</div>
            <div class="text-xs" style="color: var(--color-sub)">
              analytics.noelkleen.com
            </div>
          </a>

          <a
            href="https://studio.noelkleen.com"
            class="card-link block rounded-lg px-6 py-5 animate-in"
            style="animation-delay: 560ms"
          >
            <div class="text-sm font-medium mb-0.5">studio</div>
            <div class="text-xs" style="color: var(--color-sub)">
              studio.noelkleen.com
            </div>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
